<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 1 – Crée ton entreprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0618; --bg-0:#120827; --bg-1:#1a1033;
  --pink:#ff3d8b; --magenta:#e935c5; --violet:#9d4edd; --indigo:#6366f1; --cyan:#22d3ee; --sky:#38bdf8;
  --lime:#a3e635; --emerald:#34d399; --orange:#fb923c; --yellow:#fbbf24;
  --white:#fff; --text:rgba(255,255,255,.92); --soft:rgba(255,255,255,.7); --dim:rgba(255,255,255,.5);
  --border:rgba(255,255,255,.13); --border-soft:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.055); --glass-hover:rgba(255,255,255,.09); --glass-strong:rgba(18,8,39,.72);
  --grad:linear-gradient(120deg,var(--pink),var(--magenta) 35%,var(--violet) 70%,var(--indigo));
  --brand:#e935c5; --on-brand:#fff;
  --paper:#fff; --paper-ink:#1D1F33; --paper-line:#D5D8E6;
  --r:18px; --r-lg:26px;
  --ui:'Outfit','Segoe UI',Arial,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'Space Mono',Consolas,monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:var(--ui); background:var(--bg-deep); color:var(--text); min-height:100vh; font-size:18px; line-height:1.5; overflow-x:hidden}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
[hidden]{display:none !important}

/* ═══ Fond festif : blobs animés + grain ═══ */
.mesh{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.blob{position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; mix-blend-mode:screen}
.b1{width:520px;height:520px;background:var(--pink);top:-80px;left:-120px;animation:d1 22s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--violet);top:10%;right:-100px;animation:d2 26s ease-in-out infinite}
.b3{width:540px;height:540px;background:var(--cyan);top:40%;left:20%;opacity:.3;animation:d3 30s ease-in-out infinite}
.b4{width:420px;height:420px;background:var(--orange);bottom:5%;right:15%;opacity:.33;animation:d4 24s ease-in-out infinite}
.b5{width:380px;height:380px;background:var(--magenta);bottom:-120px;left:30%;animation:d5 28s ease-in-out infinite}
@keyframes d1{50%{transform:translate(80px,120px) scale(1.15)}} @keyframes d2{50%{transform:translate(-100px,150px) scale(1.1)}}
@keyframes d3{50%{transform:translate(120px,-80px) scale(1.2)}} @keyframes d4{50%{transform:translate(-90px,-120px) scale(1.1)}}
@keyframes d5{50%{transform:translate(110px,-60px) scale(1.15)}}
body::after{content:''; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.06; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E")}

/* ═══ Bandeau événement ═══ */
.banner{position:relative; z-index:10; color:#fff; text-align:center; padding:10px 20px; font-size:15px; font-weight:600; letter-spacing:.02em;
  background:linear-gradient(90deg,var(--pink),var(--magenta) 25%,var(--violet) 50%,var(--indigo) 75%,var(--cyan)); background-size:200% 100%;
  animation:bshift 10s linear infinite; box-shadow:0 4px 30px rgba(233,53,197,.3)}
.pulse{display:inline-block; width:8px; height:8px; background:#fff; border-radius:50%; margin-right:10px; vertical-align:middle; animation:pd 1.3s ease-in-out infinite}
@keyframes pd{50%{transform:scale(1.2); box-shadow:0 0 0 10px rgba(255,255,255,0)}}
@keyframes bshift{to{background-position:200% 0}}

/* ═══ Barre du haut ═══ */
.top{position:sticky; top:0; z-index:20; background:rgba(10,6,24,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft)}
.top-in{max-width:1280px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:16px}
.logo{width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--magenta) 40%,var(--violet)); display:grid; place-items:center;
  font-family:var(--serif); font-weight:700; color:#fff; font-size:16px; box-shadow:0 0 20px rgba(233,53,197,.5); flex:none}
.top h1{font-family:var(--serif); font-weight:600; font-size:20px; line-height:1.1}
.top h1 small{display:block; font-family:var(--ui); font-size:14px; font-weight:500; color:var(--soft)}
.right{margin-left:auto; display:flex; align-items:center; gap:14px}
.who{font-size:14px; color:var(--soft); text-align:right; line-height:1.25}
.who b{display:block; color:var(--text); font-size:15px}
.who button{background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; font-size:13px}
.xp-pill{font-family:var(--mono); font-weight:700; padding:7px 16px; border-radius:999px; color:#fff; background:var(--glass); border:1px solid var(--border); white-space:nowrap}
.xp-pill span{background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.lvl{font-size:13px; color:var(--soft); text-align:right; line-height:1.2}
.lvl b{display:block; color:var(--text); font-size:14px}
.steps{max-width:1280px; margin:0 auto; padding:0 24px 12px; display:grid; grid-template-columns:repeat(9,1fr); gap:6px}
.seg{height:7px; border-radius:6px; background:rgba(255,255,255,.1); position:relative}
.seg.done{background:var(--grad)}
.seg.now{background:linear-gradient(90deg,var(--yellow),var(--orange)); box-shadow:0 0 14px rgba(251,191,36,.6)}
.seg span{position:absolute; top:11px; left:0; font-size:12px; color:var(--yellow); white-space:nowrap; display:none}
.seg.now span{display:block}

/* ═══ Mise en page ═══ */
.wrap{position:relative; z-index:2}
.layout{max-width:1280px; margin:0 auto; padding:38px 24px 70px; display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:32px; align-items:start}
.layout.full{grid-template-columns:minmax(0,1fr); max-width:1100px}
main{min-width:0}
.glass{background:var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:var(--r-lg)}
.card{padding:28px}
.chip-label{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--text); background:var(--glass); border:1px solid var(--border); padding:6px 16px; border-radius:999px; margin-bottom:14px}
.led{width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px var(--lime)}
h2.title{font-family:var(--serif); font-weight:600; font-size:clamp(30px,3.6vw,42px); line-height:1.1; letter-spacing:-.01em; color:#fff; margin-bottom:10px}
.grad{background:linear-gradient(120deg,var(--pink),var(--magenta) 30%,var(--violet) 60%,var(--cyan)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-style:italic; font-weight:500; animation:gs 8s ease-in-out infinite}
@keyframes gs{50%{background-position:100% 50%}}
p.lead{color:var(--soft); font-size:19px; margin-bottom:22px; max-width:64ch}
.coach{display:flex; gap:14px; align-items:flex-start; padding:14px 18px; margin-bottom:24px; max-width:760px; border-radius:var(--r)}
.coach .av{flex:none; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--yellow),var(--orange)); display:grid; place-items:center; font-size:22px; box-shadow:0 0 18px rgba(251,146,60,.45)}
.coach b{color:var(--yellow)}
h3.sub{font-family:var(--serif); font-weight:600; font-size:22px; margin:26px 0 12px; color:#fff}
.sector-h{display:flex; align-items:center; gap:12px; margin:28px 0 14px}
.sector-h .rule{flex:1; height:1px; background:var(--border)}

/* ═══ Cartes de choix ═══ */
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{--g1:var(--pink); --g2:var(--violet); position:relative; text-align:left; width:100%; color:var(--text); background:var(--glass);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:22px; padding:18px 20px; cursor:pointer;
  transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s, background .2s}
.choice::before{content:''; position:absolute; inset:-1px; border-radius:22px; padding:2px; background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .3s; pointer-events:none}
.choice:hover{transform:translateY(-4px); background:var(--glass-hover)}
.choice:hover::before{opacity:.6}
.choice.on{background:color-mix(in srgb,var(--g1) 14%,transparent); box-shadow:0 16px 44px color-mix(in srgb,var(--g1) 30%,transparent)}
.choice.on::before{opacity:1}
.choice.on::after{content:"✓"; position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--g1),var(--g2)); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px}
.choice.off{opacity:.4}
.choice.full{opacity:.45; cursor:not-allowed}
.choice.full:hover{transform:none}
.sec-primaire{--g1:var(--lime); --g2:var(--emerald)}
.sec-secondaire{--g1:var(--cyan); --g2:var(--sky)}
.sec-tertiaire{--g1:var(--pink); --g2:var(--magenta)}
.choice .ico{width:62px; height:62px; border-radius:18px; display:grid; place-items:center; font-size:30px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
  box-shadow:0 10px 26px color-mix(in srgb,var(--g1) 30%,transparent); transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.choice:hover .ico{transform:scale(1.1) rotate(-6deg)}
.choice h4{font-family:var(--serif); font-weight:600; font-size:21px; margin:12px 0 6px; padding-right:32px; color:#fff}
.choice p{color:var(--soft); font-size:16px}
.choice .meta{margin-top:12px; font-size:15px}
.choice .meta div{margin-top:3px}
.choice .meta b{color:var(--g1); font-weight:600}
.tag{display:inline-block; font-size:13px; font-weight:600; padding:4px 12px; border-radius:999px; background:rgba(0,0,0,.28); color:#fff; border:1px solid var(--border); margin-top:12px}
.tag.full{background:rgba(255,61,139,.2); border-color:var(--pink)}
.counter{font-family:var(--mono); font-weight:700; color:var(--yellow)}

/* ═══ Formulaires ═══ */
label.f{display:block; font-weight:600; margin-bottom:6px}
.inp{width:100%; background:rgba(10,6,24,.55); color:#fff; border:1px solid var(--border); border-radius:14px; padding:13px 16px; font-size:18px}
.inp:focus{border-color:var(--magenta); outline:none; box-shadow:0 0 0 4px rgba(233,53,197,.2)}
.inp::placeholder{color:var(--dim)}
select.inp option{background:var(--bg-1); color:#fff}
.row{display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:16px}
.row3{grid-template-columns:2fr 1fr 1fr}
.chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
.chip{background:var(--glass); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 18px; cursor:pointer; font-size:16px; transition:all .2s}
.chip:hover{background:var(--glass-hover); transform:translateY(-2px)}
.chip.on{background:var(--grad); border-color:transparent; color:#fff}
.help{font-size:15px; color:var(--soft); margin-top:6px}
.err{color:#ffb4c8; font-size:16px; margin-top:10px}

/* ═══ Boutons ═══ */
.nav{display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap}
.btn{border:0; border-radius:14px; padding:14px 28px; font-weight:700; font-size:18px; cursor:pointer; transition:transform .25s, box-shadow .25s}
.btn-main{background:var(--grad); color:#fff; box-shadow:0 10px 30px rgba(233,53,197,.35)}
.btn-main:hover{transform:translateY(-2px); box-shadow:0 14px 36px rgba(233,53,197,.5)}
.btn-main:disabled{background:rgba(255,255,255,.1); color:var(--dim); box-shadow:none; cursor:not-allowed; transform:none}
.btn-ghost{background:var(--glass); color:var(--text); border:1px solid var(--border)}
.btn-ghost:hover{background:var(--glass-hover)}
.btn-gold{background:linear-gradient(90deg,var(--yellow),var(--orange)); color:#1a1033}
.hint{color:var(--soft); font-size:15px}
.busy{opacity:.7; pointer-events:none}

/* ═══ Défi bonus ═══ */
.bonus{margin-top:26px; border:2px dashed var(--yellow); border-radius:var(--r); padding:18px 20px; background:rgba(251,191,36,.06)}
.bonus h4{color:var(--yellow); font-size:18px; margin-bottom:4px}
.bonus p{color:var(--soft); font-size:16px; margin-bottom:12px}
.bonus.won{border-style:solid; border-color:var(--emerald); background:rgba(52,211,153,.08)}
.bonus.won h4{color:var(--emerald)}

/* ═══ Enseigne ═══ */
aside{position:sticky; top:128px}
.sign{overflow:hidden}
.sign-face{min-height:175px; background:var(--brand); color:var(--on-brand); padding:22px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; transition:background .4s; position:relative}
.sign-face::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 60%); pointer-events:none}
.sign-face.empty{background:linear-gradient(135deg,rgba(255,61,139,.25),rgba(157,78,221,.25)); color:var(--soft)}
.sign-face .emb{width:60px; height:60px; border-radius:50%; background:var(--on-brand); color:var(--brand); display:grid; place-items:center; font-size:28px; margin-bottom:10px}
.sign-face .nm{font-size:30px; line-height:1.1; font-weight:800; word-break:break-word}
.sign-face .sl{font-size:15px; margin-top:6px; opacity:.9}
.sign-body{padding:18px 20px}
.sign-body h3{font-size:15px; color:var(--soft); font-weight:600; margin-bottom:8px}
.srow{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--border-soft); font-size:15px}
.srow:first-of-type{border-top:0}
.srow .k{width:100px; flex:none; color:var(--dim)}
.srow .v{flex:1; min-width:0}
.srow .v.todo{color:var(--dim); font-style:italic}
.srow .v.mono{font-family:var(--mono); font-size:14px}
.pbar{height:8px; background:rgba(255,255,255,.1); border-radius:6px; margin-top:12px; overflow:hidden}
.pbar i{display:block; height:100%; background:var(--grad); transition:width .4s}

/* ═══ Styles de logo ═══ */
.f-moderne{font-family:var(--ui); font-weight:800}
.f-elegant{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700}
.f-fun{font-family:'Fredoka','Comic Sans MS',sans-serif; font-weight:600}
.f-street{font-family:'Bebas Neue',Impact,sans-serif; font-weight:400; letter-spacing:1.5px}
.swatches{display:flex; flex-wrap:wrap; gap:14px; padding-bottom:26px}
.sw{width:60px; height:60px; border-radius:50%; border:3px solid transparent; cursor:pointer; position:relative; transition:transform .25s}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:#fff; box-shadow:0 0 0 4px var(--bg-deep) inset, 0 0 22px rgba(255,255,255,.35)}
.sw span{position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--soft); white-space:nowrap}
.stylebtn{font-size:28px; text-align:center; padding:20px 10px}
.stylebtn small{display:block; font-family:var(--ui); font-size:14px; color:var(--soft); font-style:normal; letter-spacing:0; font-weight:500; margin-top:4px}

/* ═══ Carte d'identité ═══ */
.idcard{max-width:720px; margin:6px auto 0; background:linear-gradient(135deg,#F8F9FF,#ECEAFB); color:var(--paper-ink); border-radius:22px; padding:26px 28px 26px 34px; box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 60px rgba(233,53,197,.25); position:relative; overflow:hidden}
.idcard::before{content:""; position:absolute; inset:0 auto 0 0; width:12px; background:var(--brand)}
.idcard .hd{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--paper-line); padding-bottom:14px; margin-bottom:12px}
.idcard .emb{width:62px; height:62px; border-radius:14px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-size:30px; flex:none}
.idcard .hd h3{font-size:26px; line-height:1.1}
.idcard .hd p{color:#5B5F7A; font-size:15px; margin-top:2px}
.idgrid{display:grid; grid-template-columns:190px 1fr; gap:8px 16px; font-size:17px}
.idgrid .k{color:#5B5F7A}
.num{font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:.5px; background:#FFF3C4; border-radius:6px; padding:1px 8px; display:inline-block}
.stamp{position:absolute; right:22px; bottom:18px; transform:rotate(-12deg); border:3px solid #2E9E5B; color:#2E9E5B; font-weight:800; padding:4px 12px; border-radius:8px; font-size:16px; opacity:0}
.stamp.show{animation:stamp .5s .9s forwards}
@keyframes stamp{from{opacity:0; transform:rotate(-12deg) scale(2)} to{opacity:.9; transform:rotate(-12deg) scale(1)}}
.fict{font-size:12px; color:#7A7E98; margin-top:12px}

/* ═══ Document ═══ */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tab{background:var(--glass); color:var(--soft); border:1px solid var(--border); border-radius:999px; padding:8px 18px; cursor:pointer; font-size:15px}
.tab.on{background:#fff; color:var(--bg-deep); font-weight:700}
.paper{background:var(--paper); color:var(--paper-ink); border-radius:8px; padding:40px 44px; box-shadow:0 24px 70px rgba(0,0,0,.55); font-size:16px; line-height:1.45; max-width:840px}
.paper p{margin-bottom:10px}
.paper .dh{display:flex; justify-content:space-between; gap:24px; align-items:flex-start}
.paper .from{display:flex; gap:14px; align-items:flex-start}
.paper .from .emb{width:54px; height:54px; border-radius:12px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-size:26px; flex:none}
.paper .from .co{font-size:22px; line-height:1.15}
.paper .from p{margin:4px 0 0; font-size:14px; color:#4A4E68}
.paper .from .ids{font-family:var(--mono); font-size:12.5px}
.paper .to{border:1px solid var(--paper-line); border-radius:8px; padding:12px 16px; min-width:240px; font-size:15px}
.paper .to .lbl{font-size:12px; color:#6B6F88; margin-bottom:2px}
.paper .place{text-align:right; margin:26px 0 8px; font-size:15px}
.paper h3.doc{font-size:24px; margin:4px 0 2px; letter-spacing:.5px}
.paper .ref{font-family:var(--mono); font-size:14px; color:#4A4E68; margin-bottom:18px}
.paper table{width:100%; border-collapse:collapse; margin:14px 0}
.paper th{background:#F0F2FA; text-align:left; font-size:14px; padding:9px 10px; border-bottom:2px solid var(--paper-ink)}
.paper td{padding:9px 10px; border-bottom:1px solid var(--paper-line)}
.paper td.q{width:130px}
.paper input.qin{width:100px; border:2px dashed #8A8FB0; border-radius:6px; padding:6px 8px; font-family:var(--mono); font-size:16px; text-align:right; color:var(--paper-ink); background:#FFFBEA}
.paper input.qin:focus{border-style:solid; border-color:var(--paper-ink); outline:none}
.paper input.qin.ok{border-style:solid; border-color:#2E9E5B; background:#EFFAF3}
.paper select.din{border:2px dashed #8A8FB0; border-radius:6px; padding:6px 8px; background:#FFFBEA; color:var(--paper-ink); font-size:15px}
.paper .sig{margin-top:26px; display:flex; justify-content:flex-end}
.paper .sig div{text-align:center; min-width:260px}
.paper .sig input{width:100%; border:0; border-bottom:2px dashed #8A8FB0; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:24px; text-align:center; padding:4px; background:#FFFBEA; color:#2A2F7A}
.paper .sig input:focus{outline:none; border-bottom-style:solid}
.paper .sig .signed{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:24px; color:#2A2F7A}
.paper .sig small{display:block; color:#6B6F88; font-size:13px; margin-top:4px}
.paper .foot{margin-top:30px; border-top:1px solid var(--paper-line); padding-top:8px; font-size:11.5px; color:#8A8FA8; text-align:center}
.checklist{list-style:none; margin-top:18px; display:grid; gap:6px}
.checklist li{font-size:16px; color:var(--soft)}
.checklist li.ok{color:var(--emerald)}
.checklist li::before{content:"○ "}
.checklist li.ok::before{content:"✓ "}

/* ═══ Héros (connexion, fermeture, fin) ═══ */
.hero{position:relative; text-align:center; padding:40px 0 20px}
.confetti-layer{position:absolute; inset:-40px 0 0; overflow:hidden; pointer-events:none; z-index:0}
.confetti-layer span{position:absolute; display:block; opacity:0; animation:cfall linear infinite}
.confetti-layer span:nth-child(1){left:5%;width:8px;height:14px;background:var(--pink);animation-duration:13s}
.confetti-layer span:nth-child(2){left:13%;width:10px;height:5px;background:var(--cyan);animation-duration:15s;animation-delay:2.5s;border-radius:50%}
.confetti-layer span:nth-child(3){left:22%;width:7px;height:7px;background:var(--yellow);animation-duration:11s;animation-delay:4s;border-radius:50%}
.confetti-layer span:nth-child(4){left:31%;width:5px;height:15px;background:var(--violet);animation-duration:14s;animation-delay:1s}
.confetti-layer span:nth-child(5){left:40%;width:9px;height:9px;background:var(--lime);animation-duration:16s;animation-delay:3s;border-radius:50%}
.confetti-layer span:nth-child(6){left:49%;width:12px;height:6px;background:var(--magenta);animation-duration:12s;animation-delay:5.5s}
.confetti-layer span:nth-child(7){left:58%;width:6px;height:12px;background:var(--orange);animation-duration:14s;animation-delay:2s}
.confetti-layer span:nth-child(8){left:67%;width:8px;height:8px;background:var(--cyan);animation-duration:11s;animation-delay:6s;border-radius:50%}
.confetti-layer span:nth-child(9){left:76%;width:5px;height:14px;background:var(--pink);animation-duration:15s}
.confetti-layer span:nth-child(10){left:85%;width:10px;height:6px;background:var(--yellow);animation-duration:13s;animation-delay:3.5s}
.confetti-layer span:nth-child(11){left:93%;width:8px;height:8px;background:var(--emerald);animation-duration:16s;animation-delay:2s;border-radius:50%}
@keyframes cfall{0%{transform:translateY(-60px) rotate(0);opacity:0} 10%{opacity:.9} 90%{opacity:.9} 100%{transform:translateY(720px) rotate(720deg);opacity:0}}
.hero > *:not(.confetti-layer){position:relative; z-index:1}
.badge-school{display:inline-flex; align-items:center; gap:12px; padding:8px 22px 8px 10px; border-radius:999px; margin-bottom:28px}
.hero h2{font-family:var(--serif); font-weight:600; font-size:clamp(40px,6vw,68px); line-height:1.03; letter-spacing:-.02em; color:#fff; margin-bottom:22px}
.hero .sub{color:var(--soft); font-size:clamp(17px,1.6vw,20px); max-width:640px; margin:0 auto 28px; line-height:1.55}
.hero-meta{display:inline-flex; flex-wrap:wrap; justify-content:center; gap:10px}
.meta-chip{display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px; font-size:15px; font-weight:500}
.login{max-width:560px; margin:36px auto 0; text-align:left}
.road{list-style:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:26px}
.road li{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r)}
.road li .n{font-family:var(--mono); font-weight:700; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); color:var(--soft); flex:none}
.road li.now{border-color:rgba(251,191,36,.6); box-shadow:0 0 30px rgba(251,191,36,.15)}
.road li.now .n{background:linear-gradient(135deg,var(--yellow),var(--orange)); color:#1a1033}
.road li .t{flex:1; text-align:left}
.road li .t small{display:block; color:var(--dim); font-size:13px}
.spin{display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ Fin ═══ */
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:22px 0}
.stat{padding:18px; text-align:center}
.stat b{display:block; font-family:var(--mono); font-size:32px; background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.stat span{color:var(--soft); font-size:15px}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.badge{padding:14px; text-align:center; border-radius:var(--r)}
.badge .i{font-size:30px}
.badge b{display:block; font-size:15px; margin-top:4px}
.badge.lockd{opacity:.35}
.words{display:grid; gap:10px}
.word{background:rgba(255,255,255,.05); border-left:5px solid var(--magenta); border-radius:12px; padding:12px 16px}
.word b{font-size:18px; color:#fff}
.word span{display:block; color:var(--soft); font-size:16px}
.status{border-radius:var(--r); padding:14px 18px; margin-top:18px; font-size:16px}
.status.ok{background:rgba(52,211,153,.12); border:1px solid var(--emerald)}
.status.wait{background:rgba(56,189,248,.1); border:1px solid var(--sky)}
.status.err{background:rgba(255,61,139,.12); border:1px solid var(--pink)}
.next{margin-top:22px; padding:18px 22px; display:flex; gap:16px; align-items:center; border-radius:var(--r-lg)}
.next .ic{font-size:40px}

/* ═══ Toasts, modale, confettis ponctuels ═══ */
#toasts{position:fixed; right:22px; bottom:22px; z-index:50; display:grid; gap:10px; pointer-events:none}
.toast{pointer-events:none; background:var(--glass-strong); backdrop-filter:blur(18px); border:1px solid rgba(251,191,36,.6); border-radius:var(--r); padding:12px 18px; min-width:270px; box-shadow:0 12px 30px rgba(0,0,0,.45); animation:tin .35s ease-out}
.toast b{font-family:var(--mono); font-size:20px; color:var(--yellow)}
.toast .wd{color:var(--soft); font-size:15px}
.toast.word{border-color:rgba(233,53,197,.7)}
.toast.word b{font-family:var(--serif); color:#ff8fd0}
@keyframes tin{from{transform:translateY(20px); opacity:0} to{transform:none; opacity:1}}
.modal{position:fixed; inset:0; z-index:70; background:rgba(5,3,14,.8); display:grid; place-items:center; padding:20px}
.modal .box{padding:24px; max-width:780px; width:100%; max-height:86vh; overflow:auto; background:var(--bg-1)}
.modal pre{background:rgba(0,0,0,.35); padding:14px; border-radius:12px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; color:#E6DDFF; margin:12px 0}
.confetti{position:fixed; top:-20px; width:10px; height:16px; z-index:65; pointer-events:none; animation:fall2 linear forwards}
@keyframes fall2{to{transform:translateY(110vh) rotate(720deg)}}
.fly{position:fixed; z-index:60; font-size:44px; pointer-events:none; animation:fly 1.4s cubic-bezier(.5,0,.6,1) forwards}
@keyframes fly{to{transform:translate(70vw,-60vh) scale(.4) rotate(20deg); opacity:0}}

#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  body::after{display:none}
  #print-area{display:block}
  #print-area .paper{box-shadow:none; max-width:none; page-break-after:always; padding:10mm 6mm}
}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  aside{position:static; order:-1}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .road{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .g2,.row,.row3,.stats,.road{grid-template-columns:1fr}
  .paper{padding:24px 18px}
  .paper .dh{flex-direction:column}
  .idgrid{grid-template-columns:1fr}
  .blob{filter:blur(60px); width:340px !important; height:340px !important}
  .who{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .stamp{opacity:.9}
}

function setBrand(hex){
  const r = document.documentElement.style;
  if (!hex){ r.removeProperty("--brand"); r.removeProperty("--on-brand"); return; }
  const n = parseInt(hex.slice(1),16), R=(n>>16)&255, G=(n>>8)&255, B=n&255;
  r.setProperty("--brand", hex); r.setProperty("--on-brand", (0.299*R + 0.587*G + 0.114*B)/255 > .62 ? "#1D1F33" : "#FFFFFF");
}
function genBCE(){
  const base = "1" + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const n = base + String(97 - (parseInt(base,10) % 97)).padStart(2,"0");
  return `${n.slice(0,4)}.${n.slice(4,7)}.${n.slice(7)}`;
}
function mod97(str){ let r = 0; for (const ch of str) r = (r*10 + +ch) % 97; return r; }
function genIBAN(){
  const bank = ["001","063","068","310","363","523","732","751"][Math.floor(Math.random()*8)];
  const b10 = bank + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const bban = b10 + String(mod97(b10) || 97).padStart(2,"0");
  const iban = "BE" + String(98 - mod97(bban + "111400")).padStart(2,"0") + bban;
  return iban.match(/.{1,4}/g).join(" ");
}

function jsonp(params, timeout = 15000){
  return new Promise((resolve, reject) => {
    const cb = "cbMini" + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    const fin = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { fin(); reject(new Error("timeout")); }, timeout);
    window[cb] = (d) => { fin(); resolve(d); };
    s.onerror = () => { fin(); reject(new Error("reseau")); };
    s.src = CONFIG.ENDPOINT_URL + "?" + new URLSearchParams(Object.assign({}, params, {callback:cb, _:Date.now()})).toString();
    document.body.appendChild(s);
  });
}
function envoyer(statut){
  const data = payload(statut);
  S.lastPayload = data;
  return fetch(CONFIG.ENDPOINT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data) })
    .catch(() => null);
}

  };

    nom:S.nom.trim(), denomination:deno(), forme:forme(), direction:S.direction || "",
    nbAssocies: S.direction === "plusieurs" ? S.nbAssocies : (S.direction === "seul" ? 1 : ""),

  };
  p.achats = S.produits.map(id => { const x = prod(id); return { id, designation:x.nom, unite:x.unite, description:x.desc, quantite: +S.quantites[id] || 0 }; });
  p.fournisseurs = S.fournisseurs.map(id => { const f = four(id); return { id, nom:f.nom, forme:f.forme, denomination:`${f.nom} ${f.forme}`, rue:f.rue, cp:f.cp, ville:f.ville, pays:f.pays, description:f.desc, atout:f.atout }; });
  if (S.fournisseurs.length && S.ids) p.demandePrix = {
    date:S.dateDoc, livraisonSouhaitee:S.delai, signature:S.signature.trim(),
    documents: S.fournisseurs.map((id,i) => ({ numero:numDP(i), destinataire:four(id).nom }))
  };

  p.recompenses = { xp:S.xp, niveau:niveau(),

    motsDePro: S.mots.map(m => MOTS[m].mot) };
  p.xp = S.xp;
  p.dureeMinutes = S.startedAt ? Math.round((Date.now() - S.startedAt)/60000) : null;
  p.etatApp = { step:S.step, typeId:S.typeId, nom:S.nom, slogan:S.slogan, couleur:S.couleur, style:S.style, commune:S.commune, rue:S.rue, numero:S.numero,
    direction:S.direction, nbAssocies:S.nbAssocies, produits:S.produits, fournisseurs:S.fournisseurs, quantites:S.quantites, delai:S.delai, signature:S.signature,
    bonus:S.bonus, bonusDone:S.bonusDone, ids:S.ids, dateDoc:S.dateDoc, xp:S.xp, done:S.done, mots:S.mots, startedAt:S.startedAt, finishedAt:S.finishedAt };
  return p;
}

async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; render();
  SESSION.email = email;
  let r;
  try { r = await connexion(); } catch(e) { LOGIN.busy = false; LOGIN.err = ERREURS.reseau; render(); return; }
  LOGIN.busy = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée. Demande à ton professeur."; render(); return; }
  appliquerConnexion(r, email);
}
function appliquerConnexion(r, email){
  SESSION.compteurs = r.compteurs || {}; SESSION.max = r.max != null ? r.max : 4; SESSION.reouvert = false;
  const m = r.dossier && r.dossier.missions ? r.dossier.missions[CONFIG.MISSION] : null;
  const serveur = m && m.etatApp ? m.etatApp : null;
  const local = lireLocal(email);
  const idEleve = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT}, r.eleve || {});
  idEleve.email = email;

  if (r.statut === "termine"){
    S = restaurer(serveur); MODE = "consultation"; S.step = 10; S.envoi = {mode:"ok"};
  } else if (!r.ouvert){
    S = restaurer(serveur || (local && local.eleve && local.eleve.email === email ? local : null)); MODE = "ferme";
  } else if (r.statut === "reinitialise"){
    S = restaurer(serveur); S.step = 1; S.done = {}; S.xp = 0; S.mots = []; S.bonusDone = {}; S.envoi = null; S.finishedAt = null;
    SESSION.reouvert = true; MODE = "mission";
  } else if (r.statut === "en_cours"){
    const dernierServeur = m.dernier_envoi ? Date.parse(m.dernier_envoi) : 0;
    S = restaurer(local && local.majLocale > dernierServeur ? local : serveur); MODE = "mission";
  } else {
    S = restaurer(local && local.step < 10 ? local : null); MODE = "mission";
  }
  S.eleve = idEleve;
  if (!S.startedAt) S.startedAt = Date.now();
  if (MODE === "mission" && (S.step < 1 || S.step > 9)) S.step = 1;
  save(); render(true);
}
async function verifierOuvert(){
  try { const r = await jsonp({action:"ping"}, 10000); return !!(r && r.acces && (r.missionsOuvertes || []).indexOf(CONFIG.MISSION) >= 0); }
  catch(e) { return true; }    // souci réseau : on laisse continuer, la sauvegarde locale protège le travail
}
/** Contrôles en arrière-plan : l'élève n'attend jamais le serveur pour passer à l'étape suivante. */
async function controlerEnFond(key){
  if (!(await verifierOuvert())){
    if (MODE === "mission"){ MODE = "ferme"; save(); render(true); }
    return;
  }
  if (key === "type"){              // l'entreprise choisie était-elle encore libre ? (vérifié après l'enregistrement)
    await wait(3500);
    try {
      const r = await connexion();
      if (!r || !r.ok || MODE !== "mission") return;
      SESSION.compteurs = r.compteurs || {}; if (r.max != null) SESSION.max = r.max;
      const surServeur = r.dossier && r.dossier.entreprise ? r.dossier.entreprise.typeId : null;
      if (surServeur !== S.typeId && complet(S.typeId)){
        S.typeId = null; S.produits = []; S.fournisseurs = []; S.quantites = {}; S.step = 1; save(); render(true);
        toast("<div>Oups ! Cette entreprise vient d'être complétée par tes camarades. Choisis-en une autre : ton nom et ton slogan sont gardés.</div>");
      }
    } catch(e) {}
  }
}
/** Rafraîchit en arrière-plan les places disponibles quand l'élève arrive sur le choix de l'activité. */
let MAJ_COMPTEURS = 0;
function rafraichirCompteurs(){
  if (Date.now() - MAJ_COMPTEURS < 20000) return;
  MAJ_COMPTEURS = Date.now();
  connexion().then(r => {
    if (!r || !r.ok) return;
    SESSION.compteurs = r.compteurs || {}; if (r.max != null) SESSION.max = r.max;
    if (!r.ouvert && MODE === "mission"){ MODE = "ferme"; save(); render(true); return; }
    if (MODE === "mission" && STEPS[S.step].key === "type") render();
  }).catch(() => {});
}
function suivant(){
  const key = STEPS[S.step].key;
  if (!VALID[key]()) return;
  const st = STEPS[S.step];
  award(key, 100, st.badge);
  if (st.mot) unlockMot(st.mot);
  if (key === "direction") unlockMot(S.direction === "plusieurs" ? "srl" : "individuelle");
  S.step++; S.tab = 0;
  save(); render(true);                 // passage immédiat à l'étape suivante
  envoyer("en_cours");                  // sauvegarde dans le Sheet, en arrière-plan
  controlerEnFond(key);                 // vérifications, en arrière-plan
}
async function envoyerFinal(btn){
  if (!VALID.demande()) return;
  const r0 = btn.getBoundingClientRect();
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
    [0,1,2].forEach(i => { const f = document.createElement("div"); f.className = "fly"; f.textContent = "✉️";
      f.style.left = (r0.left + 20 + i*30) + "px"; f.style.top = (r0.top - 10) + "px"; f.style.animationDelay = (i*.2) + "s";
      document.body.appendChild(f); setTimeout(() => f.remove(), 2200); });
  award("demande", 100, STEPS[9].badge); unlockMot("demandeprix");
  S.finishedAt = Date.now(); S.step = 10; S.envoi = {mode:"wait"};
  save();
  setTimeout(() => { render(true); confetti(); }, 1100);
  await envoyer("termine");
  await confirmerEnvoi();
}
async function confirmerEnvoi(){
  for (let i = 0; i < 4; i++){
    await wait(2000 + i*1500);
    try {
      const r = await connexion();
      if (r && r.ok && r.statut === "termine"){ S.envoi = {mode:"ok"}; save(); render(); return; }
      if (r && r.ok && !r.ouvert){ S.envoi = {mode:"ferme"}; save(); render(); return; }
    } catch(e) {}
  }
  S.envoi = {mode:"err"}; save(); render();
}

function render(scroll){
  setBrand(MODE === "login" ? null : S.couleur);
  const key = MODE === "login" ? "login" : MODE === "ferme" ? "ferme" : MODE === "consultation" ? "fin" : STEPS[S.step].key;
  $("#main").innerHTML = R[key]();
  $("#topSub").textContent = key === "fin" ? "Mission 1 accomplie" : "Mission 1 : crée ton entreprise";
  updateTop(); renderSide();
  if (key === "type") rafraichirCompteurs();
  if (MODE === "login"){ const em = $("#em"); if (em && !LOGIN.busy) { em.focus(); em.setSelectionRange(em.value.length, em.value.length); } }
  if (scroll) window.scrollTo({top:0, behavior:"smooth"});
}
function refreshNav(){
  if (MODE !== "mission") return;
  const key = STEPS[S.step].key; if (!VALID[key]) return;
  const ok = VALID[key]();
  document.querySelectorAll('[data-act="next"],[data-act="send"]').forEach(b => b.disabled = !ok);
  const hint = $("#main .nav .hint"); if (hint) hint.style.visibility = ok ? "hidden" : "visible";
  if (key === "demande"){ const lis = document.querySelectorAll(".checklist li");
    if (lis.length){ lis[0].classList.toggle("ok", S.produits.every(id => +S.quantites[id] >= 1)); lis[1].classList.toggle("ok", !!S.delai); lis[2].classList.toggle("ok", S.signature.trim().length >= 3); } }
  renderSide();
}
function setPath(path, val){ const p = path.split("."); let o = S; while (p.length > 1) o = o[p.shift()]; o[p[0]] = val; }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "em"){ LOGIN.email = el.value; const b = $('[data-act="login"]'); if (b) b.disabled = !emailOk(el.value.trim().toLowerCase()); return; }
  if (MODE !== "mission") return;
  if (el.dataset.bind){ setPath(el.dataset.bind, el.value); save();
    if (el.dataset.bind === "nom" || el.dataset.bind === "slogan") document.querySelectorAll(`.chip[data-set="${el.dataset.bind}"]`).forEach(c => c.classList.toggle("on", c.dataset.val === el.value));
    if (el.tagName === "SELECT" && STEPS[S.step].key === "adresse"){ render(); return; }
    refreshNav(); }
  if (el.dataset.qty){ el.value = el.value.replace(/\D/g,""); S.quantites[el.dataset.qty] = el.value; el.classList.toggle("ok", +el.value >= 1); save(); refreshNav(); }
});
document.addEventListener("change", (e) => { if (MODE === "mission" && (e.target.dataset.bind === "delai" || e.target.dataset.bind === "bonus.prixProduit")){ setPath(e.target.dataset.bind, e.target.value); save(); refreshNav(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#modal").hidden = true;
  if (e.key === "Enter" && e.target.id === "em"){ const b = $('[data-act="login"]'); if (b && !b.disabled) b.click(); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "d"){   // Ctrl+Alt+D : données envoyées (professeur)
    const m = $("#modal"); m.innerHTML = `<div class="box glass" role="dialog"><h3 style="font-family:var(--serif)">Données de la mission (format envoyé au Google Sheet)</h3><pre>${esc(JSON.stringify(S.lastPayload || payload("apercu"), null, 2))}</pre><button class="btn btn-main" data-act="close">Fermer</button></div>`; m.hidden = false; }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "login"){ const em = LOGIN.email.trim().toLowerCase(); if (emailOk(em)) seConnecter(em); return; }
  if (b.dataset.act === "retry"){ seConnecter(S.eleve.email || SESSION.email); return; }
  if (b.dataset.act === "logout"){ save(); MODE = "login"; LOGIN = {email:"", busy:false, err:""}; S = fresh(); render(true); return; }
  if (b.dataset.act === "close"){ $("#modal").hidden = true; return; }
  if (b.dataset.act === "print"){ $("#print-area").innerHTML = S.fournisseurs.map((id,i) => docHTML(id, i, true)).join(""); window.print(); return; }
  if (b.dataset.tab !== undefined){ S.tab = +b.dataset.tab; render(); return; }
  if (b.dataset.act === "resend"){ S.envoi = {mode:"wait"}; render(); envoyer("termine").then(confirmerEnvoi); return; }
  if (MODE !== "mission") return;

  if (b.dataset.pick === "type"){
    if (complet(b.dataset.id) && S.typeId !== b.dataset.id){ toast("<div>Cette entreprise est complète. Choisis-en une autre !</div>"); return; }
    if (S.typeId !== b.dataset.id){ S.typeId = b.dataset.id; S.produits = []; S.fournisseurs = []; S.quantites = {}; S.bonusDone.produits = false; S.bonus.prixProduit = ""; }
    save(); render(); return;
  }
  if (b.dataset.pick === "produit" || b.dataset.pick === "fournisseur"){
    const arr = b.dataset.pick === "produit" ? S.produits : S.fournisseurs, id = b.dataset.id, i = arr.indexOf(id);
    if (i >= 0) arr.splice(i,1); else if (arr.length < 3) arr.push(id); else { toast(`<div>Maximum 3 ${b.dataset.pick === "produit" ? "articles" : "fournisseurs"} : retire d'abord un choix.</div>`); return; }
    save(); render(); return;
  }
  if (b.dataset.set){ S[b.dataset.set] = b.dataset.set === "nbAssocies" ? +b.dataset.val : b.dataset.val; save(); render(); return; }
  switch (b.dataset.act){
    case "next": suivant(); break;
    case "back": if (S.step > 1){ S.step--; save(); render(true); } break;
    case "rndnum": S.numero = String(1 + Math.floor(Math.random()*180)); save(); render(); break;
    case "send": envoyerFinal(b); break;
    case "bonus": {
      const k = b.dataset.b;
      const ok = k === "adresse" ? S.bonus.concurrent.trim().length >= 3 : (S.bonus.prixProduit && S.bonus.prixSite.trim().length >= 2 && /\d/.test(S.bonus.prixMontant));
      if (!ok){ toast(`<div>${k === "adresse" ? "Écris le nom du magasin trouvé et sa commune." : "Complète l'article, le magasin et le prix trouvé."}</div>`); return; }
      S.bonusDone[k] = true; S.xp += 50; toast(`<b>+50 XP</b><div>${BONUS_BADGES[k][0]} Badge débloqué : ${BONUS_BADGES[k][1]}</div>`); save(); render(); break; }
  }
});

render();
</script>
</body>
</html>
